name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  suites:
    # The three harnesses drive real WebGL. On a CPU-only Linux runner the scene
    # renders at 4 fps (SwiftShader) / 14 fps (Mesa llvmpipe at 320x200) and the
    # game clamps dt to 50 ms, so time-based assertions (walk, jump, accelerate)
    # cannot pass. The macOS runner exposes a paravirtual Metal GPU and holds 60 fps
    # at the harness viewport, so the browser suites run there.
    name: headless gameplay, interior, audit, playtest, touch, police
    needs: static
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      DTA_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for the harness
        run: |
          set -euo pipefail
          # Match the exact Chrome build this puppeteer-core was released against.
          CHROME_VERSION=$(node -p "require('puppeteer-core/lib/cjs/puppeteer/revisions.js').PUPPETEER_REVISIONS.chrome")
          echo "puppeteer-core expects chrome@$CHROME_VERSION"
          CHROME_BIN=$(node_modules/.bin/browsers install "chrome@$CHROME_VERSION" --path "$HOME/.cache/puppeteer" | tail -n 1 | sed -E 's/^[^ ]+ //')
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Production build
        run: npm run build

      - name: Serve dist and wait for HTTP 200
        env:
          # serve.py opens a browser; there is none here and Safari must not launch.
          BROWSER: /usr/bin/true
        run: |
          set -euo pipefail
          python3 serve.py 8765 > server.log 2>&1 &
          echo "server pid $!"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$DTA_URL/index.html" || true)
            if [ "$code" = "200" ]; then
              echo "server ready: HTTP $code on $DTA_URL/index.html"
              exit 0
            fi
            sleep 0.5
          done
          echo "server never answered 200 (last: $code)"
          cat server.log
          exit 1

      - name: Headless suites (all six)
        run: |
          set -euo pipefail
          # each harness must exit non-zero on a failed check; that is what makes this gate real
          node tests/qa.mjs 2>&1 | tee qa.log
          node tests/interior.mjs 2>&1 | tee interior.log
          node tests/audit.mjs 2>&1 | tee audit.log
          node tests/playtest.mjs 2>&1 | tee playtest.log
          node tests/touch.mjs 2>&1 | tee touch.log
          node tests/police-path.mjs 2>&1 | tee police.log

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-evidence
          path: |
            qa.log
            interior.log
            audit.log
            playtest.log
            touch.log
            police.log
            server.log
            screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the static server
        if: always()
        run: pkill -f "serve.py 8765" || true
