<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Asset viewer — Dude Theft Auto</title>
<style>
  html, body { margin: 0; height: 100%; background: #cfd6e0; overflow: hidden; }
  canvas { display: block; }
  #label { position: fixed; left: 12px; top: 10px; font: 600 12px ui-sans-serif, system-ui, sans-serif; color: #26303c; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="label"></div>
<script type="module">
import * as THREE from 'three';
import { Car } from '../src/vehicles/car.ts';
import { Character } from '../src/actors/character.ts';
import { Ragdoll } from '../src/actors/ragdoll.ts';
import {
  buildRoadSegment,
  buildKerbWalk,
  buildSignalIntersection,
  buildTrafficLight,
  buildUtilityPole,
  buildStreetNameSign,
  buildManhole,
  buildDrainGrate,
  buildBollard,
} from '../src/world/streetkit.ts';

// Studio viewer: one subject per page, fixed 3/4 camera, neutral lighting.
// Used to diff our generated assets against the reference screenshots.
const params = new URLSearchParams(location.search);
const kind = params.get('kind') ?? 'car';
const type = params.get('type') ?? 'muscle';
const color = params.get('color') ? parseInt(params.get('color'), 16) : undefined;
const pose = params.get('pose') ?? 'idle';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x35a8f0);
scene.fog = new THREE.Fog(0x35a8f0, 30, 90);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);

const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x8f9a86, 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4dd, 2.6);
sun.position.set(6, 9, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;
sun.shadow.camera.bottom = -8;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.MeshStandardMaterial({ color: 0xc8c8d0, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
// simple sidewalk strip for scale - not for the street kit, whose own trotoar is the subject
if (kind !== 'street') {
  const kerb = new THREE.Mesh(new THREE.BoxGeometry(14, 0.18, 3.4), new THREE.MeshStandardMaterial({ color: 0xb4b4be }));
  kerb.position.set(0, 0.09, -3.6);
  scene.add(kerb);
} else {
  // a junction is 34 m across; the studio shadow box has to cover it or the corners lose shadows
  sun.shadow.camera.left = -26;
  sun.shadow.camera.right = 26;
  sun.shadow.camera.top = 26;
  sun.shadow.camera.bottom = -26;
  sun.shadow.camera.updateProjectionMatrix();
}

let subject;

if (kind === 'car') {
  const car = new Car(scene, { type, color, position: new THREE.Vector3(0, 0, 0), yaw: Math.PI * 0.78 });
  car.mesh.position.set(0, 0, 0);
  subject = car.mesh;
  camera.position.set(5.0, 1.75, 6.0);
  camera.lookAt(0, 0.75, 0);
  document.getElementById('label').textContent = `car · ${type} · ${(color ?? 0).toString(16)}`;
} else if (kind === 'street') {
  // Street kit: one subject per part, so each builder can be judged on its own at close range.
  // `?kind=street&part=road|kerb|junction|signal|furniture|all`
  const part = params.get('part') ?? 'all';
  const ctx = { group: scene, colliders: [], audit: [] };
  const setCam = (p, t) => {
    camera.position.set(...p);
    camera.lookAt(...t);
  };
  if (part === 'road') {
    buildRoadSegment(ctx, 0, 0, 0, { roadClass: 'arterial', lengthM: 46 });
    setCam([3.5, 4.6, 18], [0, 0.4, -4]);
  } else if (part === 'kerb') {
    buildKerbWalk(ctx, 0, 0, 0, { lengthM: 16, crossingAt: 0 });
    setCam([-3.2, 1.6, 7.5], [1.9, 0.35, -0.6]);
  } else if (part === 'junction') {
    buildSignalIntersection(ctx, 0, 0, 0, { roadClass: 'local', armsM: 12, cornerRadiusM: 7 });
    setCam([13, 13, 17], [0, 0.6, 0]);
  } else if (part === 'signal') {
    buildTrafficLight(ctx, 0, 0, 0, { lit: 'green' });
    setCam([-2.6, 3.4, 9.5], [2.8, 3.4, 0]);
  } else if (part === 'furniture') {
    buildUtilityPole(ctx, -3.4, 0, 0, { spanM: 12 });
    buildStreetNameSign(ctx, 0.4, 0, 0);
    buildBollard(ctx, 2.6, 1.4, 0);
    buildBollard(ctx, 2.6, 3.2, 0);
    buildManhole(ctx, 4.6, -2.2, 0);
    buildDrainGrate(ctx, 1.4, -3.4, 0);
    setCam([7.2, 3.2, 8.2], [0.4, 1.8, 0.4]);
  } else {
    // the whole kit as the city would meet it: a junction, its pavements, and the furniture line
    buildSignalIntersection(ctx, 0, 0, 0, { roadClass: 'local', armsM: 13, cornerRadiusM: 7 });
    buildKerbWalk(ctx, -4.3, 0, Math.PI, { lengthM: 9, crossingAt: 0, tactile: false, drain: true });
    buildKerbWalk(ctx, 4.3, 0, 0, { lengthM: 9, crossingAt: 0, tactile: false, drain: true });
    buildUtilityPole(ctx, 5.6, 6.0, 0, { spanM: 12 });
    buildUtilityPole(ctx, 17.6, 6.0, 0, { spanM: 12, cables: false });
    buildStreetNameSign(ctx, 5.7, 5.2, Math.PI / 2);
    buildBollard(ctx, 4.5, 5.6, 0);
    buildBollard(ctx, 4.5, 7.0, 0);
    buildManhole(ctx, 1.2, 14.0, 0);
    buildDrainGrate(ctx, -2.4, 15.0, 0);
    setCam([16, 12, 19], [1, 0.8, -1]);
  }
  subject = ctx.group;
  document.getElementById('label').textContent = `street kit · ${part}`;
} else if (kind === 'ragdoll') {
  const r = new Ragdoll(scene, { position: new THREE.Vector3(0, 1.4, 0), yaw: 0.6, velocity: new THREE.Vector3(2, 1, 0) });
  for (let i = 0; i < 90; i++) r.update(1 / 60, []);
  subject = r.group;
  camera.position.set(3.4, 2.1, 3.6);
  camera.lookAt(0, 0.4, 0);
  document.getElementById('label').textContent = 'ragdoll · settled';
} else {
  const chars = [
    new Character({ shirt: 0x3346a8, pants: 0x1b1f2e, face: 'calm', hair: 'cap' }),
    new Character({ shirt: 0xd93b3b, pants: 0x2f3a52, face: 'stache', hair: 'back' }),
    new Character({ shirt: 0xffd23f, pants: 0x2b2b31, skin: 0x7a4a2e, face: 'shades', hair: 'bald' }),
  ];
  chars.forEach((c, i) => {
    c.group.position.set((i - 1) * 1.15, 0, 0);
    c.group.rotation.y = 0.25 - i * 0.25;
    c.setArmed(i === 1);
    c.animate(0.16, pose === 'walk' ? 0.7 : 0, { aiming: pose === 'aim' && i === 1 });
    scene.add(c.group);
  });
  camera.position.set(0.9, 1.45, 4.3);
  camera.lookAt(0, 0.95, 0);
  document.getElementById('label').textContent = `characters · ${pose}`;
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function frame() {
  requestAnimationFrame(frame);
  renderer.render(scene, camera);
}
frame();
window.__viewer = { ready: true, subject };
</script>
</body>
</html>
