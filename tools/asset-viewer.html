<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Asset viewer — Dude Theft Auto</title>
<style>
  html, body { margin: 0; height: 100%; background: #cfd6e0; overflow: hidden; }
  canvas { display: block; }
  #label { position: fixed; left: 12px; top: 10px; font: 600 12px ui-sans-serif, system-ui, sans-serif; color: #26303c; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="label"></div>
<script type="module">
import * as THREE from 'three';
import { Car } from '../src/vehicles/car.ts';
import { Character } from '../src/actors/character.ts';
import { Ragdoll } from '../src/actors/ragdoll.ts';
import { Ojek } from '../src/vehicles/ojek.ts';
import { buildKakiLima } from '../src/world/kakilima.ts';

// Studio viewer: one subject per page, fixed 3/4 camera, neutral lighting.
// Used to diff our generated assets against the reference screenshots.
const params = new URLSearchParams(location.search);
const kind = params.get('kind') ?? 'car';
const type = params.get('type') ?? 'muscle';
const color = params.get('color') ? parseInt(params.get('color'), 16) : undefined;
const pose = params.get('pose') ?? 'idle';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x35a8f0);
scene.fog = new THREE.Fog(0x35a8f0, 30, 90);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);

const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x8f9a86, 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4dd, 2.6);
sun.position.set(6, 9, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;
sun.shadow.camera.bottom = -8;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.MeshStandardMaterial({ color: 0xc8c8d0, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
// simple sidewalk strip for scale
const kerb = new THREE.Mesh(new THREE.BoxGeometry(14, 0.18, 3.4), new THREE.MeshStandardMaterial({ color: 0xb4b4be }));
kerb.position.set(0, 0.09, -3.6);
scene.add(kerb);

let subject;

if (kind === 'car') {
  const car = new Car(scene, { type, color, position: new THREE.Vector3(0, 0, 0), yaw: Math.PI * 0.78 });
  car.mesh.position.set(0, 0, 0);
  subject = car.mesh;
  camera.position.set(5.0, 1.75, 6.0);
  camera.lookAt(0, 0.75, 0);
  document.getElementById('label').textContent = `car · ${type} · ${(color ?? 0).toString(16)}`;
} else if (kind === 'ragdoll') {
  const r = new Ragdoll(scene, { position: new THREE.Vector3(0, 1.4, 0), yaw: 0.6, velocity: new THREE.Vector3(2, 1, 0) });
  for (let i = 0; i < 90; i++) r.update(1 / 60, []);
  subject = r.group;
  camera.position.set(3.4, 2.1, 3.6);
  camera.lookAt(0, 0.4, 0);
  document.getElementById('label').textContent = 'ragdoll · settled';
} else if (kind === 'ojek') {
  // The bike alone, at the origin, lit neutrally: this is where bodywork gaps are visible.
  // view=side|front|rear|top|quarter picks the camera; the default 3/4 is the gameplay angle.
  const bike = new Ojek({ color });
  bike.group.position.set(0, 0, 0);
  subject = bike.group;
  scene.add(bike.group);
  const view = params.get('view') ?? 'quarter';
  const views = {
    side: [[4.2, 0.75, 0], [0, 0.75, 0]],
    front: [[0, 0.8, 4.2], [0, 0.75, 0]],
    rear: [[0, 0.9, -4.2], [0, 0.75, 0]],
    top: [[0, 5.5, 0.01], [0, 0.6, 0]],
    quarter: [[2.9, 1.35, 3.2], [0, 0.72, 0]],
  };
  const [pos, at] = views[view] ?? views.quarter;
  camera.position.set(pos[0], pos[1], pos[2]);
  camera.lookAt(at[0], at[1], at[2]);
  document.getElementById('label').textContent = `ojek · ${view}`;
} else if (kind === 'kaki5') {
  // The gerobak on its own: the wheel axle, the handle and the canopy struts are only judgeable
  // without a street around them.
  const g = new THREE.Group();
  buildKakiLima({ group: g, colliders: [], audit: [] }, params.get('type') ?? 'bakso', 0, 0, 0);
  subject = g;
  scene.add(g);
  const view = params.get('view') ?? 'quarter';
  const views = {
    side: [[3.0, 1.5, 0.1], [0, 1.0, 0]],
    front: [[0.1, 1.5, 3.2], [0, 1.0, 0]],
    rear: [[-3.2, 1.5, 0.1], [0, 1.0, 0]],
    top: [[0.1, 5.2, 0.2], [0, 0.8, 0]],
    quarter: [[2.4, 2.0, 2.6], [0, 1.0, 0]],
    low: [[2.6, 0.55, 1.6], [0, 0.7, 0]],
  };
  const [pos, at] = views[view] ?? views.quarter;
  camera.position.set(pos[0], pos[1], pos[2]);
  camera.lookAt(at[0], at[1], at[2]);
  document.getElementById('label').textContent = `kaki lima · ${params.get('type') ?? 'bakso'} · ${view}`;
} else {
  const chars = [
    new Character({ shirt: 0x3346a8, pants: 0x1b1f2e, face: 'calm', hair: 'cap' }),
    new Character({ shirt: 0xd93b3b, pants: 0x2f3a52, face: 'stache', hair: 'back' }),
    new Character({ shirt: 0xffd23f, pants: 0x2b2b31, skin: 0x7a4a2e, face: 'shades', hair: 'bald' }),
  ];
  chars.forEach((c, i) => {
    c.group.position.set((i - 1) * 1.15, 0, 0);
    c.group.rotation.y = 0.25 - i * 0.25;
    c.setArmed(i === 1);
    c.animate(0.16, pose === 'walk' ? 0.7 : 0, { aiming: pose === 'aim' && i === 1 });
    scene.add(c.group);
  });
  camera.position.set(0.9, 1.45, 4.3);
  camera.lookAt(0, 0.95, 0);
  document.getElementById('label').textContent = `characters · ${pose}`;
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function frame() {
  requestAnimationFrame(frame);
  renderer.render(scene, camera);
}
frame();
window.__viewer = { ready: true, subject };
</script>
</body>
</html>
